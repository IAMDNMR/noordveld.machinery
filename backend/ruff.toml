# Lint and format settings. Kept out of pyproject.toml on purpose: Vercel's Python builder reads a pyproject.toml as the dependency
# list and then installs nothing from requirements.txt.
target-version = "py312"
line-length = 100
extend-exclude = ["data", "graph", ".venv"]

[lint]
select = ["E4", "E7", "E9", "F"]

[format]
quote-style = "double"
indent-style = "space"
